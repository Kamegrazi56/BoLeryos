# Fichier à coller tel quel dans Portainer (Stacks > Add stack > Web editor).
# L'image est construite directement depuis GitHub : aucune variable à déclarer.
# Les réglages techniques (URL de connexion, etc.) se modifient dans app/config.py.
# L'identifiant et le mot de passe du jeu se saisissent dans l'interface web.
services:
  boleryos:
    build: https://github.com/Kamegrazi56/BoLeryos.git#claude/bot-login-setup
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
