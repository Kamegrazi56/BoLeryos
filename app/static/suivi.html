<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BoLeryos | Suivi</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><strong>BOLERYOS</strong></a>
    <nav>
      <a href="/">Accueil</a>
      <a href="/ecran">Écran</a>
      <a href="/reglages">Réglages</a>
      <a href="/suivi">Suivi</a>
    </nav>
    <button id="power" class="power off" type="button" aria-pressed="false">Bot : OFF</button>
    <span id="badge" class="badge idle">Non connecté</span>
  </header>

  <main class="settings-page">
    <section class="card" id="panel-log" aria-labelledby="log-title">
      <h2 id="log-title">Journal</h2>
      <div class="row">
        <label class="switch"><input type="checkbox" id="log-details"> Afficher les détails techniques</label>
        <label class="switch">Niveau
          <select id="log-level" style="width:auto">
            <option value="">Tout</option>
            <option value="warn">Avertissements et erreurs</option>
            <option value="error">Erreurs seulement</option>
          </select></label>
      </div>
      <div id="log" class="log"></div>
    </section>
  </main>
  <script src="/static/shell.js"></script>
  <script src="/static/suivi.js"></script>
</body>
</html>
