<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BoLeryos | Accueil</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="home">
  <header class="top">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><strong>BOLERYOS</strong></a>
    <nav>
      <a href="/">Accueil</a>
      <a href="/ecran">Écran</a>
      <a href="/reglages">Réglages</a>
      <a href="/suivi">Suivi</a>
    </nav>
    <button id="power" class="power off" type="button" aria-pressed="false">Bot : OFF</button>
    <span id="activity" class="activity off" role="status" aria-live="polite">À l'arrêt</span>
    <span id="badge" class="badge idle">Non connecté</span>
  </header>

  <main class="page">
    <section class="card" aria-labelledby="account-title">
      <h2 id="account-title">1. Compte</h2>
      <div class="fields fields-login">
        <label>Identifiant <input id="login-id" type="text" autocomplete="username"></label>
        <label>Mot de passe <input id="login-pw" type="password" autocomplete="off"></label>
        <button id="login-save" class="button" type="button">Se connecter</button>
        <button id="login-forget" type="button">Oublier</button>
      </div>
      <p id="login-msg" class="hint" role="status"></p>
    </section>

    <section class="card" id="servers-card" aria-labelledby="servers-title">
      <h2 id="servers-title">2. Serveurs du compte</h2>
      <div class="row">
        <button id="scan-servers" type="button">Lire mes serveurs</button>
        <span id="scan-msg" class="hint" role="status"></span>
      </div>
      <div id="server-list"></div>
    </section>

    <section class="card" aria-labelledby="instances-title">
      <h2 id="instances-title">3. Instances (un bot par serveur)</h2>
      <div id="instance-table"></div>
      <p id="instance-hint" class="hint" role="status"></p>
    </section>

    <div id="instance-view">
    <section class="card hero" aria-labelledby="hero-title">
      <div style="flex:1; min-width:260px">
        <h1 id="hero-title">Connexion</h1>
        <p id="sentence" class="sentence" role="status">Chargement…</p>
        <p id="counters" class="counters"></p>
      </div>
      <a class="button" href="/reglages">Compte et univers</a>
    </section>

    <div class="grid-2">
      <section class="card" aria-labelledby="planets-title">
        <h2 id="planets-title">Mes planètes</h2>
        <div id="planets"></div>
        <p id="planets-meta" class="hint"></p>
      </section>
      <section class="card" aria-labelledby="events-title">
        <h2 id="events-title">Derniers événements</h2>
        <ul id="events" class="events"></ul>
        <p><a href="/suivi">Voir tout le journal</a></p>
      </section>
    </div>
    </div>
  </main>
  <script src="/static/instance.js"></script>
  <script src="/static/shell.js"></script>
  <script src="/static/home.js"></script>
</body>
</html>
