<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BoLeryos | Actions</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <strong>BOLERYOS</strong>
    <nav>
      <a href="/vision">Vision</a>
      <a href="/actions" class="active">Actions</a>
    </nav>
    <span id="badge" class="badge idle">Non connecté</span>
  </header>
  <main>
    <section class="card">
      <h1>Actions à automatiser</h1>
      <p id="empty" class="actions-empty">Aucune action n'est encore disponible. Elles seront ajoutées une par une, une fois le jeu exploré après connexion.</p>
    </section>
  </main>
  <script>
    const LABELS = { idle: "Non connecté", logging_in: "Connexion…", logged_in: "Connecté", error: "Échec" };
    fetch("/api/status").then((r) => r.json()).then((s) => {
      const badge = document.getElementById("badge");
      badge.className = "badge " + s.state;
      badge.textContent = LABELS[s.state] || s.state;
    });
  </script>
</body>
</html>
