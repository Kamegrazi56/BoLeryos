<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BoLeryos | Vision</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <strong>BOLERYOS</strong>
    <nav>
      <a href="/">Connexion</a>
      <a href="/vision" class="active">Vision</a>
      <a href="/actions">Actions</a>
    </nav>
    <span id="badge" class="badge idle">Non connecté</span>
    <button id="logout" class="secondary" type="button">Se déconnecter</button>
  </header>
  <div class="app-grid vision">
    <section class="card stage">
      <div class="toolbar">
        <span>Page : <span id="page">-</span> · <span id="message"></span></span>
        <label class="switch"><input type="checkbox" id="manual"> Contrôle manuel</label>
      </div>
      <div id="screen" class="screen" tabindex="0"><span>Démarrage du navigateur du bot…</span></div>
    </section>
    <aside class="card side">
      <h1>Journal du bot</h1>
      <div id="log" class="log"></div>
    </aside>
  </div>
  <script src="/static/vision.js"></script>
</body>
</html>
