name: Publier l'image Docker

# Construit l'image et la publie sur GitHub Container Registry (ghcr.io)
# à chaque mise à jour du code, pour que Portainer n'ait plus rien à construire.
on:
  push:
    branches:
      - main
      - claude/bot-login-setup
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/kamegrazi56/boleryos:latest
